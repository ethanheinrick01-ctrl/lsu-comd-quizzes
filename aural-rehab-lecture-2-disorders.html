 groups cochlear malformations by their extent. Do not assign one universal severity.", "external": [], "source": "Lecture 2 · slides 20", "evidence": "slide-linked"}, {"id": "connexin", "name": "Connexin 26 hearing loss", "group": "Prenatal / nonsyndromic", "slides": "21–22", "cause": "Autosomal recessive connexin / gap-junction protein mutation", "features": "Disrupted potassium exchange in the organ of Corti; no accompanying syndrome", "hl": "Sensorineural", "severity": "Mild to profound", "pattern": "Usually congenital; progression can occur", "clue": "A baby has isolated hereditary hearing loss tied to a gap-junction protein involved in potassium exchange.", "hook": "Potassium exchange fails; the neural tissue may remain intact.", "images": [], "note": "Slide 22 links intact auditory neural tissue to good cochlear-implant outcomes in severe-to-profound cases. This is a course mechanism, not an outcome guarantee.", "external": [], "source": "Lecture 2 · slides 21–22", "evidence": "slide-linked"}, {"id": "rubella", "name": "Congenital rubella syndrome", "group": "Prenatal infections", "slides": "25", "cause": "Maternal rubella infection (German measles)", "features": "Congenital infection with developmental disability", "hl": "Sensorineural", "severity": "Not specified in this lecture", "pattern": "Progressive", "clue": "Maternal German measles is linked to progressive hearing loss in a child.", "hook": "German measles → rubella → progressive SNHL.", "images": [], "note": "Type and progression are supported by the completed deck and Sept. 1 lecture. The transcript is too unclear to assign a precise degree.", "external": [], "source": "Lecture 2 · slides 25", "evidence": "slide-linked"}, {"id": "cmv", "name": "Cytomegalovirus (CMV)", "group": "Prenatal infections", "slides": "26–27", "cause": "Herpes-family virus; transmission through infected secretions", "features": "Congenital infection may accompany neurologic or visual problems", "hl": "Sensorineural", "severity": "Mild to profound", "pattern": "Unilateral or bilateral; stable, fluctuating, or progressive", "clue": "A congenital herpes-family infection produces hearing loss that can affect one or both ears and may worsen after newborn screening.", "hook": "CMV varies: side, severity, and course.", "images": [], "note": "The transmission slide lists prenatal placenta, perinatal cervix, and postnatal breast milk. Do not assume every route carries the same hearing-loss risk.", "external": [], "source": "Lecture 2 · slides 26–27", "evidence": "slide-linked"}, {"id": "toxo", "name": "Toxoplasmosis", "group": "Prenatal infections", "slides": "28", "cause": "Parasitic infection associated with domestic and wild animals", "features": "Retinal disease and cognitive deficits", "hl": "Sensorineural", "severity": "Profound in the lecture example", "pattern": "Congenital example", "clue": "A parasitic infection is associated with retinal disease, cognitive deficits, and the lecture’s profound hearing-loss example.", "hook": "Parasite + retina + profound SNHL.", "images": [], "note": "Profound is the course example, not a claim that every infected child has profound loss.", "external": [], "source": "Lecture 2 · slides 28", "evidence": "slide-linked"}, {"id": "syphilis", "name": "Congenital syphilis", "group": "Prenatal infections", "slides": "29", "cause": "Maternal bacterial sexually transmitted infection passed to the fetus", "features": "Many affected infants are asymptomatic at birth", "hl": "Sensorineural", "severity": "Mild to profound", "pattern": "Late onset and progressive", "clue": "An infant is initially asymptomatic after a maternal sexually transmitted infection, then develops progressively worse hearing later.", "hook": "Quiet at birth does not mean hearing stays normal.", "images": [], "note": "Degree and delayed progression: Sept. 1 transcript paragraphs 123–124; also student notes on slide 29.", "external": [], "source": "Lecture 2 · slides 29", "evidence": "slide-linked"}, {"id": "hiv", "name": "HIV: treatment-related hearing loss", "group": "Prenatal infections", "slides": "30", "cause": "Ototoxic medication used in the HIV-treatment scenario", "features": "Growth restriction and prematurity are also discussed", "hl": "Sensorineural", "severity": "Not specified in this lecture", "pattern": "Treatment-related scenario", "clue": "The professor discusses a child with HIV whose hearing is affected by ototoxic medication.", "hook": "For this lecture scenario, target the drug mechanism.", "images": [], "note": "Class-specific scope: the Sept. 1 lecture emphasizes medication-related SNHL. HIV-associated hearing loss more broadly is not limited to this mechanism.", "external": [], "source": "Lecture 2 · slides 30", "evidence": "slide-linked"}, {"id": "hsv", "name": "Herpes simplex virus (HSV)", "group": "Prenatal infections", "slides": "31", "cause": "Direct exposure to active maternal herpes during birth", "features": "Central nervous system involvement", "hl": "Sensorineural", "severity": "Variable; no numeric range specified", "pattern": "Perinatal exposure emphasized", "clue": "An infant is exposed to an active maternal herpes infection during delivery, with possible CNS involvement.", "hook": "HSV clue: exposure during delivery.", "images": [], "note": "", "external": [], "source": "Lecture 2 · slides 31", "evidence": "slide-linked"}, {"id": "rh", "name": "Maternal–fetal Rh incompatibility", "group": "Perinatal / systemic", "slides": "32", "cause": "Maternal antibodies destroy Rh-positive fetal red blood cells", "features": "Hemolysis, jaundice, and possible brain injury", "hl": "Sensorineural", "severity": "Not specified in this lecture", "pattern": "Maternal–fetal immune mechanism", "clue": "Maternal antibodies attack fetal red blood cells; jaundice and CNS injury may follow.", "hook": "Blood breakdown → bilirubin burden → auditory risk.", "images": [], "note": "This card teaches the lecture’s mechanism. It is not a schedule for RhoGAM administration.", "external": [], "source": "Lecture 2 · slides 32", "evidence": "slide-linked"}, {"id": "anoxia", "name": "Anoxia", "group": "Perinatal / systemic", "slides": "34", "cause": "Insufficient oxygen before, during, or shortly after birth", "features": "Risk context includes respiratory problems and very low birth weight", "hl": "Sensorineural", "severity": "High frequencies more affected; no fixed overall degree", "pattern": "Near-normal low frequencies with steeply worse high frequencies", "clue": "Following oxygen deprivation, an infant responds to lower-pitched sounds but has much poorer high-frequency hearing.", "hook": "Normal lows can conceal damaged highs.", "images": [], "note": "Configuration and type: Sept. 1 transcript paragraphs 137–140 and student slide notes.", "external": [], "source": "Lecture 2 · slides 34", "evidence": "slide-linked"}, {"id": "hemorrhage", "name": "Intracranial hemorrhage", "group": "Perinatal / systemic", "slides": "35", "cause": "Bleeding within the brain or skull, associated with prematurity", "features": "Grades I–IV; hydrocephalus may complicate the bleed", "hl": "Sensorineural", "severity": "Mild to profound", "pattern": "Variable degree", "clue": "A premature infant has a brain bleed graded I through IV and develops hydrocephalus.", "hook": "Brain bleed; grade IV is most severe.", "images": [], "note": "Hearing degree comes from the lecture transcript paragraph 142 and student notes. Hemorrhage grade is not a dB hearing-loss grade.", "external": [], "source": "Lecture 2 · slides 35", "evidence": "slide-linked"}, {"id": "meningitis", "name": "Meningitis", "group": "Postnatal causes", "slides": "24, 37", "cause": "Bacterial or viral infection involving the meninges", "features": "Lecture emphasizes the greater danger of bacterial meningitis", "hl": "Sensorineural", "severity": "Variable; no fixed degree specified", "pattern": "Postnatal cause in this lecture", "clue": "A child develops meningitis; the lecturer emphasizes bacterial disease as especially damaging.", "hook": "Bacterial is the major danger emphasized here.", "images": [], "note": "Slide 37 and Sept. 1 transcript paragraphs 143–149, 154. A precise audiogram is not supplied.", "external": [], "source": "Lecture 2 · slides 24, 37", "evidence": "slide-linked"}, {"id": "mumps", "name": "Mumps", "group": "Postnatal causes", "slides": "37", "cause": "Postnatal viral infection", "features": "Named viral example in the postnatal list", "hl": "Sensorineural", "severity": "Variable; no fixed degree specified", "pattern": "Postnatal cause in this lecture", "clue": "Which listed postnatal infection is the viral example paired with meningitis in the lecture?", "hook": "Mumps = the listed postnatal virus.", "images": [], "note": "This is a list-level entry: the slide does not provide a characteristic degree or laterality. Do not memorize an invented one.", "external": [], "source": "Lecture 2 · slides 37", "evidence": "slide-linked"}, {"id": "ototoxins", "name": "Ototoxins / chemotherapy", "group": "Postnatal causes", "slides": "37", "cause": "Exposure to medication toxic to auditory structures", "features": "The lecture emphasizes monitoring at-risk children", "hl": "Sensorineural", "severity": "Variable; no fixed degree specified", "pattern": "Progression is a reason for monitoring", "clue": "A child receives an ototoxic medication and needs continued hearing monitoring.", "hook": "Medication exposure → monitor hearing over time.", "images": [], "note": "Slide 37 and Sept. 1 transcript paragraphs 150–154. Specific drugs and dose thresholds are beyond this lecture entry.", "external": [], "source": "Lecture 2 · slides 37", "evidence": "slide-linked"}, {"id": "trauma", "name": "Trauma", "group": "Postnatal causes", "slides": "37", "cause": "Acoustic, blunt, or penetrating injury", "features": "Examples include blast noise and accidents", "hl": "Sensorineural", "severity": "Variable; no fixed degree specified", "patt const {disorders:D,questions:Q,version}=window.DRILL_DATA;
const byD=Object.fromEntries(D.map(d=>[d.id,d])),byQ=Object.fromEntries(Q.map(q=>[q.id,q]));
const KEY='comd4590-lecture2-drill-v1';
let store={records:{},concepts:{},history:[],session:null},storageOK=true;
try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&typeof v==='object'&&v.records&&v.concepts&&Array.isArray(v.history))store={...store,...v};}catch(e){storageOK=false;}
if(store.session&&(!Array.isArray(store.session.pool)||store.session.pool.some(id=>!byQ[id])))store.session=null;
let view='drill',atlasGroup='All',atlasSearch='',selected=null,compareA='apert',compareB='crouzon';
const main=document.querySelector('main'),warning=document.querySelector('#storage-warning');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const imgURI=name=>window.DRILL_IMAGES[name];
const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){storageOK=false;}warning.textContent=storageOK?'':'Browser storage is unavailable. You can drill now, but progress may not survive closing this page.';}
function status(id){const c=store.concepts[id];return c?.mastered?'Mastered':c?.misconception?'High-confidence miss':c?.attempts?'Learning':'Not started';}
function photo(name,alt,caption=''){return `<figure class="qvisual"><button data-zoom="${esc(name)}" aria-label="Enlarge lecture image"><img src="${imgURI(name)}" alt="${esc(alt)}"></button>${caption?`<figcaption>${esc(caption)}</figcaption>`:''}</figure>`;}
function links(d){return d.external.map(([label,url])=>`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`).join(' · ');}
function source(d){return `<details class="evidence"><summary>Source & precision notes</summary><p><strong>${esc(d.source)}</strong> · 77-slide student copy. After slide 39, the 76-slide completed copy runs one slide number earlier.</p>${d.note?`<p>${esc(d.note)}</p>`:''}${d.external.length?`<p>Clinical cross-check: ${links(d)}</p>`:''}<p>Original practice questions. Photos are excerpts supplied in Lecture 2; they illustrate course examples and are not a diagnostic test. Exact dB values are not invented where the lecture gives none.</p></details>`;}
function setView(v){view=v;selected=null;render();window.scrollTo(0,0);}
function render(){document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.view===view?'page':'false'));save();if(view==='atlas')renderAtlas();else if(view==='compare')renderCompare();else if(view==='progress')renderProgress();else renderHome();}
function groupOptions(value='All'){return ['All',...new Set(D.map(d=>d.group))].map(g=>`<option ${g===value?'selected':''}>${esc(g)}</option>`).join('');}
function renderHome(){
 const s=store.session;
 main.innerHTML=`<section class="hero"><div><p class="eyebrow">COMD 4590 / Lecture 02</p><h1>Know the disorder.<br><span class="accent">Explain the hearing.</span></h1><p class="lede">Build the chain from cause to consequences. Drill every named condition in Lecture 2, with the pictures and distinctions that make them stick.</p><div class="metrics"><div><strong>${D.length}</strong><small>conditions</small></div><div><strong>${Q.length}</strong><small>original questions</small></div><div><strong>14</strong><small>picture + clue items</small></div></div></div><aside class="heroart" aria-label="The lecture learning pattern"><p class="eyebrow">The pattern to know</p>${['What causes it?','What changes or goes wrong?','What type of hearing loss?','How severe? Stable or progressive?'].map((t,i)=>`<div class="flowline"><b>0${i+1}</b><span>${t}</span></div>`).join('')}<p class="caption">Learn the cluster. Then retrieve it without the notes.</p></aside></section><section class="setup"><div class="sectionhead"><h2>Choose your drill</h2><span class="tag">Shuffled every run</span></div><div class="fields"><div><label for="group">Scope</label><select id="group">${groupOptions()}</select></div><div><label for="mode">Session</label><select id="mode"><option value="20">Quick drill · 20 questions</option><option value="36">Coverage round · one per condition</option><option value="all">Full bank · every question</option><option value="visual">Picture + clue round</option><option value="missed">Missed / low-confidence review</option></select></div><div><label for="kind">Focus</label><select id="kind"><option>All skills</option>${[...new Set(Q.map(q=>q.kind))].filter(k=>k!=='Picture + clue').map(k=>`<option>${esc(k)}</option>`).join('')}</select></div></div><div class="actions"><button class="primary" id="start">Start drilling →</button>${s&&!s.finished?'<button id="resume">Resume saved session</button>':''}<button data-view="atlas">Study the picture atlas</button></div><p id="start-notice" class="notice">Misses return after two intervening questions; low-confidence correct answers return after four. Your first-pass score stays separate from retries.</p></section><div class="notice"><strong>About the source:</strong> Covers the entire supplied Lecture 2 deck, including material beyond the available Sept. 1 recording. This is a lecture drill, not a verified exam blueprint. Later unfinished blanks are checked against the completed copy; clinical nuances are labeled in the atlas.</div><div class="switches"><button id="home-compare">Compare skull / face syndromes</button><button data-open="anoxia">Explore the anoxia hearing pattern</button><button data-view="progress">Review your weak spots</button></div>`;
 document.querySelector('#start').onclick=startFromForm;
 document.querySelector('#home-compare').onclick=()=>{compareA='apert';compareB='crouzon';setView('compare');};
 document.querySelector('#resume')?.addEventListener('click',()=>showQuestion());
}
function startFromForm(){const group=document.querySelector('#group').value,mode=document.querySelector('#mode').value,kind=document.querySelector('#kind').value;let pool=Q.filter(q=>(group==='All'||byD[q.concept].group===group)&&(kind==='All skills'||q.kind===kind));if(mode==='visual')pool=Q.filter(q=>q.kind==='Picture + clue'&&(group==='All'||byD[q.concept].group===group));if(mode==='missed')pool=pool.filter(q=>store.records[q.id]?.needsReview);if(!pool.length){document.querySelector('#start-notice').textContent='No questions match this selection. Choose another scope/focus or complete a drill first.';return;}let base=shuffle(pool);
 if(mode==='20'||mode==='36'){let heads=shuffle([...new Set(pool.map(q=>q.concept))]).map(id=>shuffle(pool.filter(q=>q.concept===id))[0]);const chosen=new Set(heads.map(q=>q.id));base=[...heads,...base.filter(q=>!chosen.has(q.id))];base=base.slice(0,mode==='20'?Math.min(20,pool.length):heads.length);}
 // Use all roots in the selected scope as fillers if a narrow focus needs intervening activities.
 const fillers=Q.filter(q=>group==='All'||byD[q.concept].group===group);
 begin(base.map(q=>q.id),fillers.map(q=>q.id),`${group==='All'?'All conditions':group} · ${mode==='all'?'Full bank':mode==='36'?'Coverage round':mode==='visual'?'Picture round':mode==='missed'?'Review':'Quick drill'}`);
}
function begin(ids,pool,title){store.session={title,base:[...ids],remaining:[...ids],pool,review:[],first:{},completed:0,retries:0,recent:[],current:null,finished:false,started:Date.now()};save();showQuestion();}
function pickNext(s){if(s.current)return;let id,repeat=false;const due=s.review.findIndex(x=>x.due<=s.completed);if(due>=0){id=s.review.splice(due,1)[0].id;repeat=true;}else if(s.remaining.length){id=s.remaining.shift();}else if(s.review.length){const pending=new Set(s.review.map(x=>x.id));let candidates=s.pool.filter(id=>!pending.has(id)&&!s.recent.slice(-2).includes(id));if(!candidates.length)candidates=s.pool.filter(id=>!pending.has(id));if(!candidates.length)throw new Error('No intervening question available');id=shuffle(candidates).sort((a,b)=>(store.records[a]?.attempts||0)-(store.records[b]?.attempts||0))[0];repeat=true;}else{finish(s);return;}
 s.current={id,order:shuffle([0,1,2,3]),choice:null,confidence:null,graded:false,assisted:false,repeat};save();}
function showQuestion(){view='drill';document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.view==='drill'?'page':'false'));const s=store.session;if(!s){renderHome();return;}if(s.finished){renderResults();return;}pickNext(s);if(s.finished){renderResults();return;}const c=s.current,q=byQ[c.id],d=byD[q.concept];const answered=Object.keys(s.first).length;
 main.innerHTML=`<section class="question"><div class="toolbar"><button id="pause" class="ghost small">← Save & exit</button><span class="muted">${esc(s.title)}</span></div><div class="qmeta"><span>${c.repeat?'Adaptive review':'First pass'} · ${esc(q.kind)}</span><span>${answered}/${s.base.length} first-pass answered · ${s.review.length} queued reviews</span></div><div class="progress"><span style="width:${100*answered/s.base.length}%"></span></div><h2 id="question-title" tabindex="-1">${esc(q.prompt)}</h2>${q.image?photo(q.image,'Lecture clinical example. Use the accompanying case clue to identify the condition.','Lecture image · tap to enlarge'):''}<div class="choices" role="group" aria-labelledby="question-title">${c.order.map((idx,i)=>`<button class="choice ${c.choice===idx?'selected':''} ${c.graded&&idx===q.answer?'correct':''} ${c.graded&&c.choice===idx&&!c.ok?'incorrect':''}" data-choice="${idx}" aria-pressed="${c.choice===idx}" ${c.graded?'disabled':''}><span class="letter" aria-hidden="true">${i+1}</span><span>${esc(q.choices[idx])}</span></button>`).join('')}</div>${!c.graded?`<div class="confidence"><label>How confident are you in this answer?</label><div class="actions">${['low','medium','high'].map(k=>`<button data-confidence="${k}" aria-pressed="${c.confidence===k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div></div><div class="actions"><button class="primary" id="check" ${c.choice===null||!c.confidence?'disabled':''}>Check answer</button><button class="ghost small" id="hint-button">Show hint · no mastery credit</button></div><p class="hint" id="hint">${c.assisted?esc(q.hint):''}</p>`:`<div class="feedback ${!c.ok?'wrong':''}" role="status"><h3>${c.ok?'Correct':'Not quite'}${c.confidence==='high'&&!c.ok?' · high-confidence miss':''}</h3><p><strong>${esc(q.choices[q.answer])}</strong></p><p>${esc(q.explanation)}</p><p class="muted">${!c.ok?'This item returns after two intervening questions.':c.confidence==='low'||c.assisted?'This item returns after four intervening questions.':store.concepts[q.concept]?.mastered?'Condition mastered: two consecutive unassisted correct answers on different question roots; latest confidence medium or high.':'Build mastery with another distinct question about this condition.'}</p><div class="source">${esc(q.source)} ${d.external.length?'· '+links(d):''}</div></div><div class="actions"><button class="primary" id="next">Continue →</button><button class="ghost" data-open="${d.id}">Open this condition’s atlas card</button></div>`}</section>`;
 document.querySelector('#pause').onclick=()=>setView('drill');
 document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{c.choice=Number(b.dataset.choice);save();refreshInputs();});
 document.querySelectorAll('[data-confidence]').forEach(b=>b.onclick=()=>{c.confidence=b.dataset.confidence;save();refreshInputs();});
 document.querySelector('#check')?.addEventListener('click',grade);
 document.querySelector('#hint-button')?.addEventListener('click',()=>{c.assisted=true;document.querySelector('#hint').textContent=q.hint;save();});
 document.querySelector('#next')?.addEventListener('click',()=>{s.current=null;save();showQuestion();document.querySelector('#question-title')?.focus();window.scrollTo(0,0);});
}
function refreshInputs(){const c=store.session.current;document.querySelectorAll('[data-choice]').forEach(b=>{b.classList.toggle('selected',Number(b.dataset.choice)===c.choice);b.setAttribute('aria-pressed',Number(b.dataset.choice)===c.choice);});document.querySelectorAll('[data-confidence]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.confidence===c.confidence));document.querySelector('#check').disabled=c.choice===null||!c.confidence;}
function grade(){const s=store.session,c=s.current;if(c.graded||c.choice===null||!c.confidence)return;const q=byQ[c.id],ok=c.choice===q.answer;c.ok=ok;c.graded=true;s.completed++;s.recent.push(q.id);s.recent=s.recent.slice(-8);if(c.repeat)s.retries++;
 if(s.base.includes(q.id)&&!Object.hasOwn(s.first,q.id))s.first[q.id]={ok,confidence:c.confidence,assisted:c.assisted};
 const r=store.records[q.id]||{attempts:0,correct:0};r.attempts++;r.correct+=Number(ok);r.needsReview=!ok||c.confidence==='low'||c.assisted;r.lastConfidence=c.confidence;r.lastCorrect=ok;store.records[q.id]=r;
 const m=store.concepts[q.concept]||{attempts:0,roots:[],mastered:false,misconception:false};m.attempts++;m.lastConfidence=c.confidence;if(!ok||c.assisted){m.roots=[];m.mastered=false;}else{if(m.roots.at(-1)!==q.id)m.roots=[...m.roots,q.id].slice(-2);m.mastered=new Set(m.roots).size===2&&c.confidence!=='low';}if(!ok&&c.confidence==='high')m.misconception=true;if(m.mastered)m.misconception=false;store.concepts[q.concept]=m;
 if(r.needsReview){s.review=s.review.filter(x=>x.id!==q.id);s.review.push({id:q.id,due:s.completed+(!ok?2:4)});}save();showQuestion();document.querySelector('.feedback')?.scrollIntoView({block:'nearest'});}
function finish(s){s.finished=true;const first=Object.values(s.first),h={date:Date.now(),title:s.title,correct:first.filter(x=>x.ok).length,total:s.base.length,attempts:s.completed,retries:s.retries};store.history.push(h);store.history=store.history.slice(-60);save();}
function renderResults(){const s=store.session;const values=Object.values(s.first),correct=values.filter(x=>x.ok).length,weak=Object.keys(s.first).filter(id=>!s.first[id].ok||s.first[id].confidence==='low'||s.first[id].assisted);main.innerHTML=`<section class="question"><p class="eyebrow">Session complete</p><h1>Keep the first score honest.</h1><div class="summary-score">${correct} / ${s.base.length}</div><p class="muted">First pass · ${Math.round(correct/s.base.length*100)}% correct. Retries do not inflate this score.</p><div class="stats-grid"><div class="stat"><strong>${s.completed}</strong><small>Total attempts</small></div><div class="stat"><strong>${s.retries}</strong><small>Review / intervening attempts</small></div><div class="stat"><strong>${Object.values(store.concepts).filter(c=>c.mastered).length}/${D.length}</strong><small>Conditions mastered overall</small></div></div><div class="actions"><button class="primary" data-view="drill">Choose another drill</button>${weak.length?'<button id="retry-session">Drill this session’s weak spots</button>':''}<button data-view="progress">See progress</button></div>${weak.length?`<h2>First-pass misses or uncertain answers</h2><div class="catalogue">${[...new Set(weak.map(id=>byQ[id].concept))].map(id=>`<article class="tile"><h3>${esc(byD[id].name)}</h3><p>${esc(byD[id].hook)}</p><button data-open="${id}">Review card</button></article>`).join('')}</div>`:'<p class="hook">Every first-pass answer was correct without a hint and with medium or high confidence.</p>'}</section>`;document.querySelector('#retry-session')?.addEventListener('click',()=>begin(shuffle(weak),s.pool,'Session weak spots'));}
function renderAtlas(){if(selected){renderDetail(selected);return;}main.innerHTML=`<p class="eyebrow">Study before retrieval</p><div class="sectionhead"><h1 style="font-size:2.8rem;margin:0">The disorder atlas</h1><span class="muted">${D.length} conditions</span></div><p class="lede">Search a disorder or a clue. Open a card for the cause → consequence → hearing profile.</p><div class="fields" style="grid-template-columns:2fr 1fr"><div><label for="search">Search names, features, and hearing patterns</label><input id="search" type="search" placeholder="Try: thyroid, kidney, progressive…" value="${esc(atlasSearch)}"></div><div><label for="atlas-group">Category</label><select id="atlas-group">${groupOptions(atlasGroup)}</select></div></div><div id="atlas-count" class="muted"></div><div id="atlas-list" class="catalogue"></div>`;document.querySelector('#search').oninput=e=>{atlasSearch=e.target.value;renderTiles();};document.querySelector('#atlas-group').onchange=e=>{atlasGroup=e.target.value;renderTiles();};renderTiles();}
function renderTiles(){const found=D.filter(d=>(atlasGroup==='All'||d.group===atlasGroup)&&[d.name,d.group,d.cause,d.features,d.hl,d.severity,d.pattern].join(' ').toLowerCase().includes(atlasSearch.toLowerCase()));document.querySelector('#atlas-count').textContent=`${found.length} of ${D.length} conditions`;document.querySelector('#atlas-list').innerHTML=found.length?found.map(d=>`<article class="tile">${d.images.length?`<img class="thumb" src="${imgURI(d.images[0])}" alt="${esc(d.name+' lecture example')}" loading="lazy">`:''}<span class="tag">${esc(d.group)}</span><h3>${esc(d.name)}</h3><p>${esc(d.hook)}</p><p><strong>${esc(d.hl)}</strong></p><span class="tag ${status(d.id)==='Mastered'?'green':status(d.id)==='High-confidence miss'?'red':''}">${status(d.id)}</span><button data-open="${d.id}" aria-label="Study ${esc(d.name)}">Study card →</button></article>`).join(''):'<p class="empty">No matching conditions. Try another clue.</p>';}
function anoxiaChart(){return `<div class="anoxia-chart"><svg viewBox="0 0 540 300" role="img" aria-label="Illustrative audiogram shape: low-frequency thresholds near normal, dropping to poorer hearing in high frequencies. Values are schematic, not patient data."><rect width="540" height="300" rx="16" fill="#181d24"/><text x="24" y="28" fill="#c2b0ee" font-size="15">ANOXIA: ILLUSTRATIVE SHAPE ONLY</text><path d="M66 65V230H495" fill="none" stroke="#87909e"/><path d="M66 95H495M66 140H495M66 185H495" stroke="#343944"/><text x="7" y="84" fill="#b4b7c2" font-size="12">Better</text><text x="7" y="222" fill="#b4b7c2" font-size="12">Poorer</text><text x="70" y="261" fill="#b4b7c2" font-size="13">Low frequencies</text><text x="381" y="261" fill="#b4b7c2" font-size="13">High frequencies</text><path d="M83 81L157 83L237 91L310 128L391 189L475 215" stroke="#d4ed9a" stroke-width="4" fill="none"/><text x="126" y="119" fill="#d4ed9a" font-size="13">Near-normal lows</text><text x="306" y="96" fill="#d4ed9a" font-size="13">Steep high-frequency loss</text></svg><p class="caption">Original schematic based on slide 34 and the lecture explanation. No patient thresholds or exact degree are implied.</p></div>`;}
function renderDetail(id){const d=byD[id];main.innerHTML=`<div class="toolbar"><button id="back-atlas" class="ghost small">← All conditions</button><span class="tag">${esc(d.source)}</span></div><p class="eyebrow">${esc(d.group)} · ${status(d.id)}</p><h1 style="font-size:clamp(2.2rem,5vw,3.7rem)">${esc(d.name)}</h1><div class="detail-grid ${d.images.length?'':'no-photo'}"><div>${d.images.length?`<div class="photo-list">${d.images.map(name=>`<button data-zoom="${esc(name)}" aria-label="Enlarge ${esc(d.name)} lecture picture"><img src="${imgURI(name)}" alt="${esc(d.features)}"></button>`).join('')}</div><p class="caption">Supplied Lecture 2 image(s): slide ${d.images.map(n=>Number(n.match(/slide-(\d+)/)[1])).filter((v,i,a)=>a.indexOf(v)===i).join(', ')}. Click to enlarge. Observe the feature cluster alongside the history.</p>`:`<div class="chain"><div><small>Cause</small>${esc(d.cause)}</div><span>↓</span><div><small>What happens</small>${esc(d.features)}</div><span>↓</span><div><small>Hearing consequence</small>${esc(d.hl)}</div></div><p class="caption">Mechanism summary from the lecture. No clinical photograph is supplied for this condition in the deck.</p>`}${d.id==='anoxia'?anoxiaChart():''}</div><div><dl class="facts">${[['Cause / inheritance',d.cause],['What happens / identifying features',d.features],['Hearing-loss type',d.hl],['How severe?',d.severity],['Onset, laterality & course',d.pattern]].map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl><div class="hook"><strong>Recall hook</strong><br>${esc(d.hook)}</div><div class="actions"><button class="primary" id="drill-condition">Drill this condition</button><button id="compare-condition">Compare with another</button>${store.session&&!store.session.finished?'<button id="return-session">Return to saved question</button>':''}</div></div></div>${source(d)}`;document.querySelector('#back-atlas').onclick=()=>{selected=null;renderAtlas();};document.querySelector('#drill-condition').onclick=()=>{view='drill';document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.view===view?'page':'false'));const ids=Q.filter(q=>q.concept===id).map(q=>q.id);begin(shuffle(ids),ids,d.name);};document.querySelector('#compare-condition').onclick=()=>{compareA=id;if(compareB===id)compareB=D.find(x=>x.id!==id).id;setView('compare');};document.querySelector('#return-session')?.addEventListener('click',()=>{view='drill';showQuestion();});}
function renderCompare(){const a=byD[compareA],b=byD[compareB];const options=id=>D.map(d=>`<option value="${d.id}" ${d.id===id?'selected':''}>${esc(d.name)}</option>`).join('');main.innerHTML=`<p class="eyebrow">Compare the whole pattern</p><h1 style="font-size:2.9rem">Similar clues. Different conditions.</h1><div class="switches"><button data-pair="apert,crouzon">Apert / Crouzon</button><button data-pair="usher,pendred">Usher / Pendred</button><button data-pair="michel,mondini">Michel / Mondini</button><button data-pair="bor,charge">BOR / CHARGE</button><button data-pair="fas,jbs">FAS / Johanson–Blizzard</button></div><div class="fields" style="grid-template-columns:1fr 1fr;margin-top:25px"><div><label for="compare-a">First condition</label><select id="compare-a">${options(compareA)}</select></div><div><label for="compare-b">Second condition</label><select id="compare-b">${options(compareB)}</select></div></div><div class="scrolltable"><table class="comparison"><thead><tr><th>Compare</th><th>${esc(a.name)}</th><th>${esc(b.name)}</th></tr></thead><tbody>${[['cause','Cause'],['features','Features'],['hl','Hearing type'],['severity','Degree'],['pattern','Course'],['hook','Recall hook'],['source','Source']].map(([key,label])=>`<tr><th scope="row">${label}</th><td>${esc(a[key])}</td><td>${esc(b[key])}</td></tr>`).join('')}</tbody></table></div><div class="actions" style="margin-top:24px"><button data-open="${a.id}">Open ${esc(a.name)}</button><button data-open="${b.id}">Open ${esc(b.name)}</button><button class="primary" id="drill-pair">Drill this pair</button></div>`;document.querySelector('#compare-a').onchange=e=>{compareA=e.target.value;renderCompare();};document.querySelector('#compare-b').onchange=e=>{compareB=e.target.value;renderCompare();};document.querySelectorAll('[data-pair]').forEach(bt=>bt.onclick=()=>{[compareA,compareB]=bt.dataset.pair.split(',');renderCompare();});document.querySelector('#drill-pair').onclick=()=>{const ids=Q.filter(q=>[compareA,compareB].includes(q.concept)).map(q=>q.id);view='drill';begin(shuffle(ids),ids,'Comparison drill');};}
function renderProgress(){const mastered=D.filter(d=>store.concepts[d.id]?.mastered).length,weak=Q.filter(q=>store.records[q.id]?.needsReview),mis=D.filter(d=>store.concepts[d.id]?.misconception).length;main.innerHTML=`<p class="eyebrow">Saved on this browser</p><h1 style="font-size:2.9rem">Evidence of learning</h1><p class="lede">Mastery requires two consecutive correct, unassisted answers on different question roots about a condition. The latest confidence must be medium or high.</p><div class="stats-grid"><div class="stat"><strong>${mastered}/${D.length}</strong><small>Conditions mastered</small></div><div class="stat"><strong>${weak.length}</strong><small>Items needing review</small></div><div class="stat"><strong>${mis}</strong><small>Unresolved high-confidence misses</small></div></div><div class="actions"><button class="primary" id="review-weak" ${weak.length?'':'disabled'}>Drill weak items</button><button id="export-progress">Export progress</button><button class="ghost" id="reset-progress">Reset this drill’s progress</button></div><p class="notice">Progress is local to this browser and site address. Opening the downloaded file uses separate storage from the published site.</p><div class="scrolltable"><table><thead><tr><th>Condition</th><th>Status</th><th>Attempts</th><th>Review</th></tr></thead><tbody>${D.map(d=>`<tr><th scope="row">${esc(d.name)}</th><td>${status(d.id)}</td><td>${store.concepts[d.id]?.attempts||0}</td><td><button class="small" data-open="${d.id}">Study</button></td></tr>`).join('')}</tbody></table></div><h2>Completed sessions</h2>${store.history.length?`<div class="scrolltable"><table><thead><tr><th>Session</th><th>Date</th><th>First pass</th></tr></thead><tbody>${[...store.history].reverse().map(h=>`<tr><td>${esc(h.title)}</td><td>${new Date(h.date).toLocaleDateString()}</td><td>${h.correct} / ${h.total}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No completed sessions yet.</p>'}`;document.querySelector('#review-weak').onclick=()=>{view='drill';begin(shuffle(weak.map(q=>q.id)),Q.map(q=>q.id),'Weak-item review');};document.querySelector('#export-progress').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({version,...store},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='comd4590-lecture2-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};document.querySelector('#reset-progress').onclick=()=>{if(confirm('Reset only Lecture 2 disorder-drill progress and the saved session in this browser? Other quizzes are untouched.')){store={records:{},concepts:{},history:[],session:null};save();renderProgress();}};}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){setView(b.dataset.view);}else if(b.dataset.open){view='atlas';selected=b.dataset.open;render();window.scrollTo(0,0);}else if(b.dataset.zoom){const dialog=document.querySelector('dialog');dialog.querySelector('img').src=imgURI(b.dataset.zoom);dialog.querySelector('img').alt='Enlarged source lecture image';dialog.showModal();}});
document.querySelector('#close-image').onclick=()=>document.querySelector('dialog').close();
document.querySelector('dialog').addEventListener('click',e=>{if(e.target.tagName==='DIALOG')e.target.close();});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)||document.querySelector('dialog').open)return;const s=store.session;if(!document.querySelector('.question')||!s?.current||s.finished)return;if(!s.current.graded&&/^[1-4]$/.test(e.key)){document.querySelectorAll('[data-choice]')[Number(e.key)-1]?.click();}if(e.key==='Enter'&&document.activeElement.tagName!=='BUTTON'){if(s.current.graded)document.querySelector('#next')?.click();else document.querySelector('#check')?.click();}});
render();
</script></body></html>
